<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Assistant の設定</title>
  <link rel="stylesheet" href="sidepanel.css">
  <style>
    body {
      display: block;
      padding: 24px 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .hint {
      margin: 6px 0 0;
      color: var(--text-muted);
      font-size: 12.5px;
    }
    .hint a {
      color: var(--accent);
    }
    input[type="password"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font: inherit;
      color: inherit;
    }
    textarea {
      max-height: none;
      min-height: 90px;
      resize: vertical;
    }
    .key-row {
      display: flex;
      gap: 6px;
    }
    .key-row input {
      flex: 1;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .message {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .message.success {
      background: #e6f4ea;
      color: #1e6b34;
    }
    .message.error {
      background: var(--danger-bg);
      color: var(--danger-text);
    }
    @media (prefers-color-scheme: dark) {
      .message.success {
        background: #1f3527;
        color: #8fd6a4;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Claude Assistant の設定</h1>

    <div class="form-group">
      <label for="apiKey">Claude APIキー</label>
      <div class="key-row">
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
        <button id="toggleKeyButton" class="tool-button" type="button">表示</button>
        <button id="testKeyButton" class="tool-button" type="button">接続テスト</button>
      </div>
      <p class="hint">
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">Claude Console</a> で発行できます。
        キーはこの端末のブラウザ内にだけ保存され、Anthropic のAPI以外には送信されません。
      </p>
    </div>

    <div class="form-group">
      <label for="model">モデル</label>
      <select id="model"></select>
    </div>

    <div class="form-group">
      <label for="effort">思考の深さ（effort）</label>
      <select id="effort"></select>
      <p class="hint">高くするほど難しい質問に強くなりますが、応答に時間がかかり料金も増えます。</p>
    </div>

    <div class="form-group">
      <label for="language">回答の言語</label>
      <select id="language"></select>
    </div>

    <div class="form-group">
      <label for="customInstructions">追加の指示（任意）</label>
      <textarea id="customInstructions" placeholder="例: 私はWebエンジニアです。技術的な説明は省略せずに書いてください。"></textarea>
      <p class="hint">すべての会話でClaudeに伝える、あなたの好みや前提です。</p>
    </div>

    <div class="form-group">
      <label>キーボードショートカット</label>
      <p class="hint">
        初期設定では <strong>Alt+Shift+C</strong> でサイドパネルを開きます。
        <a href="#" id="shortcutsLink">ショートカットを変更する</a>
      </p>
    </div>

    <div class="actions">
      <button id="saveButton" class="primary-button" type="button">保存</button>
      <div id="message" class="message" role="status" hidden></div>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
